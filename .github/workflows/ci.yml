name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: "PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
                laravel: ['11.*', '12.*']
                include:
                    - laravel: '11.*'
                      testbench: '^9.0'
                    - laravel: '12.*'
                      testbench: '^10.0'
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring
                  coverage: none

            - name: Constrain Laravel version
              run: composer require --no-update --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Run full gate
              run: composer check

    lowest-deps:
        name: "Lowest dependencies"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mbstring
                  coverage: none

            - name: Install lowest dependencies
              run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress

            - name: Run tests
              run: composer test

    clean-room:
        name: "Clean-room install"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mbstring
                  coverage: none

            - name: Prepare package copy
              run: |
                  mkdir /tmp/eagle-eye
                  rsync -a --exclude=.git --exclude=vendor "$GITHUB_WORKSPACE/" /tmp/eagle-eye/

            - name: Create fresh Laravel application
              run: composer create-project laravel/laravel:^12.0 laravel --no-interaction --no-progress

            - name: Require package via path repository
              working-directory: laravel
              run: |
                  composer config repositories.eagle-eye '{"type":"path","url":"/tmp/eagle-eye","options":{"symlink":false}}'
                  composer require dotswan/eagle-eye:@dev --no-interaction --no-progress
                  ./artisan key:generate --force
                  echo "EAGLE_EYE_SECURITY_KEY=$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"

            - name: Zero-code capture proof through the real container
              working-directory: laravel
              run: |
                  ./artisan vendor:publish --tag=eagle-eye-migrations
                  ./artisan migrate --force
                  cat > eagle-eye-smoke.php <<'PHP'
                  <?php
                  require __DIR__.'/vendor/autoload.php';
                  use Illuminate\Contracts\Http\Kernel;
                  use Illuminate\Http\Request;

                  $app = require __DIR__.'/bootstrap/app.php';
                  $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

                  $schema = $app['db']->connection()->getSchemaBuilder();
                  $schema->dropIfExists('smoke_posts');
                  $schema->create('smoke_posts', function ($table): void {
                      $table->increments('id');
                      $table->string('title')->nullable();
                  });

                  $app['router']->get('/eagle-eye-smoke', fn (): string => 'ok');

                  $kernel = $app->make(Kernel::class);
                  $request = Request::create('/eagle-eye-smoke', 'GET');
                  $response = $kernel->handle($request);
                  $kernel->terminate($request, $response);

                  $post = new class extends Illuminate\Database\Eloquent\Model {
                      protected $table = 'smoke_posts';
                      protected $guarded = [];
                      public $timestamps = false;
                  };
                  $post->fill(['title' => 'smoke'])->save();

                  event(new Illuminate\Auth\Events\Login('web', new Illuminate\Auth\GenericUser(['id' => 1, 'name' => 'Smoke']), false));

                  $app->terminate();

                  $actions = $app['db']->table('activity_logs')->pluck('action')->all();
                  $traceIds = $app['db']->table('activity_logs')->whereIn('action', ['model.created', 'http.request'])->pluck('trace_id')->unique()->all();
                  $failures = 0;

                  foreach (['http.request', 'model.created', 'auth.login'] as $expected) {
                      if (! in_array($expected, $actions, true)) {
                          fwrite(STDERR, "Missing captured action: {$expected}\n");
                          $failures++;
                      } else {
                          echo "Captured zero-code action: {$expected}\n";
                      }
                  }

                  if (count($traceIds) !== 1) {
                      fwrite(STDERR, 'HTTP and model entries did not share a trace id.');
                      $failures++;
                  } else {
                      echo "Correlated trace across http and model entries.\n";
                  }

                  exit($failures > 0 ? 1 : 0);
                  PHP
                  php eagle-eye-smoke.php

    database-drivers:
        name: "Database driver · MySQL"
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
                    MYSQL_DATABASE: eagle_eye_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping --silent"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, pdo_mysql
                  coverage: none

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Run database driver suite on MySQL
              run: vendor/bin/pest tests/Feature/DatabaseDriverContractTest.php tests/Feature/DatabaseDriverTest.php
              env:
                  DB_CONNECTION: mysql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_DATABASE: eagle_eye_test
                  DB_USERNAME: root
                  DB_PASSWORD: ''

    loki:
        name: "Loki (${{ matrix.mode }})"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                mode: [metadata, json, collector]
        steps:
            - uses: actions/checkout@v4

            - name: Start Loki after checkout
              run: |
                  docker run --detach --name eagle-eye-loki --publish 3100:3100 \
                    --volume "$GITHUB_WORKSPACE/tests/Support/loki-ci.yaml:/etc/loki/local-config.yaml:ro" \
                    grafana/loki:3.4.2 -config.file=/etc/loki/local-config.yaml
                  for attempt in {1..60}; do
                    wget -qO- http://127.0.0.1:3100/ready && exit 0
                    sleep 1
                  done
                  docker logs eagle-eye-loki
                  exit 1

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Run Loki driver suite against grafana/loki:3
              run: vendor/bin/pest tests/Feature/LokiContractTest.php tests/Feature/LokiWritersTest.php tests/Unit/LokiTest.php tests/Unit/LokiFormatTest.php
              env:
                  EAGLE_EYE_LOKI_TEST_URL: http://127.0.0.1:3100
                  EAGLE_EYE_LOKI_MODE: ${{ matrix.mode }}

    coverage:
        name: "Coverage"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Start Loki after checkout
              run: |
                  docker run --detach --name eagle-eye-loki --publish 3100:3100 \
                    --volume "$GITHUB_WORKSPACE/tests/Support/loki-ci.yaml:/etc/loki/local-config.yaml:ro" \
                    grafana/loki:3.4.2 -config.file=/etc/loki/local-config.yaml
                  for attempt in {1..60}; do
                    wget -qO- http://127.0.0.1:3100/ready && exit 0
                    sleep 1
                  done
                  docker logs eagle-eye-loki
                  exit 1

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: curl, mbstring
                  coverage: pcov

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Run tests with coverage
              run: vendor/bin/pest --coverage --min=90
              env:
                  EAGLE_EYE_LOKI_TEST_URL: http://127.0.0.1:3100
                  EAGLE_EYE_LOKI_MODE: metadata
